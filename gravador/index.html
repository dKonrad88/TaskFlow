<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gravador</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#045ABF">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Tema Klain — página de login pública do Hub Klain (cores, logo, fundo) */
:root{--k-brand:#045ABF;--k-primary:#0d6efd;--k-primary-h:#0b5ed7;--k-text:#212529;--k-muted:rgba(33,37,41,.75);--k-border:#dee2e6;--k-card:#f8f9fa;--k-success:#198754;--k-danger:#dc3545;--k-logo-blue:#009EE0;--k-logo-red:#E2001A;--k-r:.375rem;--k-r-lg:.5rem;
 --k-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Liberation Sans",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji"}
*{box-sizing:border-box}
html{background:var(--k-brand)}
body{margin:0;min-height:100vh;font-family:var(--k-font);color:var(--k-text);line-height:1.5;background-color:var(--k-brand);background-image:url(bg.jpg);background-size:65%;background-repeat:no-repeat;background-position-y:-16em;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media (max-width:600px){body{background-image:radial-gradient(ellipse 90% 45% at 50% 18%,#1f86f0 0%,rgba(4,90,191,0) 70%)}}
.logo{display:block;margin:8px auto 12px;width:140px;height:auto}
.ttl{text-align:center;color:#fff;font-size:18px;font-weight:500;margin:-8px 0 16px;letter-spacing:.3px}
#login,#app{max-width:520px;margin:0 auto}
.card{background:var(--k-card);border:1px solid var(--k-border);border-radius:var(--k-r-lg);padding:16px;margin-bottom:12px;box-shadow:0 .5rem 1rem rgba(0,0,0,.15)}
.hide{display:none}
input{font-family:inherit;font-size:17px;padding:.6rem .75rem;border-radius:var(--k-r);border:1px solid var(--k-border);background:#fff;color:var(--k-text);width:100%}
input:focus{outline:none;border-color:#86b7fe;box-shadow:0 0 0 .25rem rgba(13,110,253,.25)}
button{font-family:inherit;font-size:16px;padding:.375rem .75rem;border-radius:var(--k-r);border:1px solid var(--k-primary);background:#fff;color:var(--k-primary);cursor:pointer}
#send,#now{background:var(--k-primary);border-color:var(--k-primary);color:#fff;font-size:1.25rem;padding:.5rem 1rem;border-radius:var(--k-r-lg);width:100%;font-weight:500}
#send:active,#now:active{background:var(--k-primary-h);border-color:#0a58ca}
button:disabled{opacity:.65}
#rec{display:block;margin:20px auto 8px;width:170px;height:170px;border-radius:50%;background:var(--k-primary);border:6px solid #fff;box-shadow:0 0 0 2px var(--k-primary),0 8px 20px rgba(13,110,253,.35);font-size:20px;font-weight:700;color:#fff}
#rec.on{background:var(--k-danger);box-shadow:0 0 0 2px var(--k-danger),0 8px 20px rgba(220,53,69,.35);animation:p 1s infinite}@keyframes p{50%{transform:scale(.94)}}
#timer{text-align:center;font-size:28px;font-variant-numeric:tabular-nums}.msg{text-align:center;color:var(--k-muted);min-height:22px;margin:8px 0 0}
h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
ul{list-style:none;padding:0;margin:0}li{background:#fff;border:1px solid var(--k-border);border-radius:var(--k-r-lg);padding:10px 12px;margin:8px 0;font-size:14px}
.st{float:right;padding:.2em .65em;border-radius:50rem;font-size:12px;font-weight:700;color:#fff}
.pendente{background:#6c757d}.processando{background:var(--k-primary)}.processado{background:var(--k-success)}.erro{background:var(--k-danger)}
.t{color:var(--k-muted);margin-top:4px;white-space:pre-wrap}a{color:#fff}
#ref{font-size:13px;padding:2px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--k-text);color:#fff;padding:12px 18px;border-radius:var(--k-r-lg);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}#toast.show{opacity:1}#toast.ok{background:var(--k-success)}#toast.err{background:var(--k-danger)}
#tipos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:10px 16px;border-radius:50rem;border:1.5px solid var(--k-primary);background:#fff;color:var(--k-primary);font-size:16px;flex:0 1 auto}
.chip[aria-pressed="true"]{background:var(--k-primary);color:#fff;font-weight:600}
</style></head><body>
<img class="logo" src="logo.png" alt="Klain"><div class="ttl">🎙️ Gravador</div>
<div id="login" class="hide"><div class="card"><p style="margin-top:0">Entre com seu e-mail e senha.</p>
<form id="lform" onsubmit="return false"><input id="email" type="email" autocomplete="username" value="konraddiego@gmail.com" style="width:100%;box-sizing:border-box"><br><br>
<input id="pw" type="password" autocomplete="current-password" placeholder="senha" style="width:100%;box-sizing:border-box"><br><br>
<button id="send" type="submit">Entrar</button></form><p id="lmsg" class="msg"></p></div></div>
<div id="app" class="hide">
<div class="card"><div id="tipos" role="group" aria-label="Tipo da gravação">
<button type="button" class="chip" data-v="automatico" aria-pressed="true">automático</button><button type="button" class="chip" data-v="tarefa" aria-pressed="false">tarefa</button><button type="button" class="chip" data-v="compromisso" aria-pressed="false">compromisso</button><button type="button" class="chip" data-v="nota" aria-pressed="false">nota</button><button type="button" class="chip" data-v="rotina" aria-pressed="false">rotina</button></div>
<button id="rec">Gravar</button><div id="timer">0:00</div><p id="msg" class="msg"></p>
<button id="now">📤 Enviar agora</button></div>
<div class="card"><h2>Recentes <button id="ref">atualizar</button></h2><ul id="list"></ul></div>
<p style="text-align:center"><a href="#" id="out">sair</a></p></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ALLOWED='konraddiego@gmail.com';
const sb=supabase.createClient('https://gigkrjetrtbtdmdnqoof.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZ2tyamV0cnRidGRtZG5xb29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MzI2MzUsImV4cCI6MjA5NzUwODYzNX0.XSeJtNUOh2_DHjat4QL9Lae6PwqflSagvDj9mXL75cA',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
const $=id=>document.getElementById(id);let user=null,mr=null,chunks=[],t0=0,tick=null;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function show(s){user=s?.user||null;
 if(user&&user.email?.toLowerCase()!==ALLOWED){await sb.auth.signOut();user=null;$('lmsg').textContent='E-mail não autorizado.'}
 $('login').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);if(user)load()}
sb.auth.onAuthStateChange((_e,s)=>show(s));sb.auth.getSession().then(({data})=>show(data.session));
$('send').onclick=async()=>{const e=$('email').value.trim().toLowerCase(),password=$('pw').value;
 if(e!==ALLOWED){$('lmsg').textContent='E-mail não autorizado.';return}
 if(!password){$('lmsg').textContent='Digite sua senha.';return}
 $('lmsg').textContent='Entrando…';const{error}=await sb.auth.signInWithPassword({email:e,password});
 if(error){$('lmsg').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos':('Erro: '+error.message);return}
 $('lmsg').textContent='';$('pw').value=''};
$('out').onclick=e=>{e.preventDefault();sb.auth.signOut()};$('ref').onclick=()=>load();
let tipoAtual='automatico';try{tipoAtual=localStorage.getItem('gravador_tipo')||'automatico'}catch(_){}
function setTipo(v){if(!document.querySelector('.chip[data-v="'+v+'"]'))v='automatico';tipoAtual=v;
 document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v?'true':'false'));try{localStorage.setItem('gravador_tipo',v)}catch(_){}}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setTipo(c.dataset.v));setTipo(tipoAtual);
const FN='https://gigkrjetrtbtdmdnqoof.supabase.co/functions/v1/voice-queue?action=trigger';let tt=null;
function toast(m,k){const t=$('toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(tt);tt=setTimeout(()=>t.className='',3500)}
async function enviarAgora(auto){const b=$('now');b.disabled=true;try{const{data}=await sb.auth.getSession();const tok=data.session?.access_token;if(!tok)throw new Error('sessão expirada');
 const r=await fetch(FN,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:'{}'});const j=await r.json().catch(()=>({}));
 if(r.ok&&j.skipped){if(!auto)toast('Já acionado há pouco — aguarde '+(j.wait_s||20)+'s','')}
 else if(r.ok)toast('🚀 Hub Klain acionado'+(j.pending!=null?' ('+j.pending+' pendente'+(j.pending==1?'':'s')+')':''),'ok');
 else toast('Erro ao acionar ('+r.status+')','err')}catch(e){toast('Erro: '+e.message,'err')}finally{b.disabled=false}}
$('now').onclick=()=>enviarAgora(false);
function pickMime(){for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg;codecs=opus'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return''}
$('rec').onclick=async()=>{if(mr&&mr.state==='recording'){mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const m=pickMime();mr=new MediaRecorder(st,m?{mimeType:m}:{});chunks=[];
 mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{st.getTracks().forEach(x=>x.stop());clearInterval(tick);$('rec').classList.remove('on');$('rec').textContent='Gravar';upload((Date.now()-t0)/1000)};
 mr.start(1000);t0=Date.now();$('rec').classList.add('on');$('rec').textContent='Parar';$('msg').textContent='Gravando…';
 tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
 catch(e){$('msg').textContent='Sem acesso ao microfone: '+e.message}};
async function upload(dur){const mime=(mr.mimeType||chunks[0]?.type||'audio/webm').split(';')[0];const ext=mime.includes('mp4')||mime.includes('aac')?'m4a':mime.includes('ogg')?'ogg':'webm';
 const blob=new Blob(chunks,{type:mime});const path=`${user.id}/${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;$('msg').textContent='Enviando…';
 let{error}=await sb.storage.from('voice-inbox').upload(path,blob,{contentType:mime});
 if(!error)({error}=await sb.from('voice_queue').insert({user_id:user.id,tipo:tipoAtual,audio_path:path,mime,duracao_s:Math.round(dur*10)/10}));
 $('msg').textContent=error?('Erro: '+error.message):'✅ Enviado para a fila';$('timer').textContent='0:00';load();if(!error)enviarAgora(true)}
async function load(){const{data,error}=await sb.from('voice_queue').select('id,created_at,tipo,status,duracao_s,transcricao,erro').order('created_at',{ascending:false}).limit(20);
 const ul=$('list');ul.innerHTML='';if(error){ul.textContent='Erro: '+error.message;return}
 for(const r of data){const li=document.createElement('li');const d=new Date(r.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
 li.innerHTML=`<span class="st ${r.status}"></span><b></b> · <span></span><div class="t"></div>`;li.children[0].textContent=r.status;li.children[1].textContent=r.tipo;
 li.children[2].textContent=d+(r.duracao_s?` · ${r.duracao_s}s`:'');li.children[3].textContent=r.transcricao||r.erro||'';ul.appendChild(li)}}
</script></body></html>
