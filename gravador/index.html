$('rec').onclick=async()=>{if(mr&&mr.state==='recording'){mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const m=pickMime();mr=new MediaRecorder(st,m?{mimeType:m}:{});chunks=[];
 mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{st.getTracks().forEach(x=>x.stop());clearInterval(tick);$('rec').classList.remove('on');$('rec').setAttribute('aria-label','Gravar');$('timer').className='idle';upload((Date.now()-t0)/1000)};
 mr.start(1000);t0=Date.now();$('rec').classList.add('on');$('rec').setAttribute('aria-label','Parar');$('timer').className='';$('timer').textContent='0:00';$('msg').textContent='Gravando… toque para parar';menu(false);
 tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
 catch(e){$('msg').textContent='Sem acesso ao microfone: '+e.message}};
async function upload(dur){const mime=(mr.mimeType||chunks[0]?.type||'audio/webm').split(';')[0];const ext=mime.includes('mp4')||mime.includes('aac')?'m4a':mime.includes('ogg')?'ogg':'webm';
 const blob=new Blob(chunks,{type:mime});const path=`${user.id}/${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;$('msg').textContent='Enviando…';
 let{error}=await sb.storage.from('voice-inbox').upload(path,blob,{contentType:mime});
 if(!error)({error}=await sb.from('voice_queue').insert({user_id:user.id,tipo:tipoAtual,audio_path:path,mime,duracao_s:Math.round(dur*10)/10}));
 $('msg').textContent=error?('Erro: '+error.message):'✅ Enviado para a fila';$('timer').className='idle';$('timer').textContent='Toque para gravar';load();if(!error){enviarAgora(true);toast('✅ Gravação enviada — acompanhe na Fila')}}
function itemEl(r){const li=document.createElement('li');li.className='item g';const t=TI[r.tipo]||[r.tipo,'🎙️',r.tipo];
 const d=new Date(r.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
 li.innerHTML='<div class="ic"></div><div class="body"><div class="it"></div><div class="is"></div><div class="tx"></div></div><span class="st"></span>';
 li.querySelector('.ic').textContent=t[1];li.querySelector('.it').textContent=t[2];li.querySelector('.is').textContent=d+(r.duracao_s?' · '+r.duracao_s+'s':'');
 const tx=r.transcricao||r.erro||'';const x=li.querySelector('.tx');if(tx)x.textContent=tx;else x.remove();
 const st=li.querySelector('.st');st.classList.add(r.status);st.textContent=r.status;return li}
async function load(){const{data,error}=await sb.from('voice_queue').select('id,created_at,tipo,status,duracao_s,transcricao,erro').order('created_at',{ascending:false}).limit(50);
 const ul=$('list'),hl=$('hist');ul.innerHTML='';hl.innerHTML='';if(error){ul.textContent='Erro: '+error.message;return}
 const fila=data.filter(r=>r.status!=='processado'),hist=data.filter(r=>r.status==='processado');
 fila.forEach(r=>ul.appendChild(itemEl(r)));hist.forEach(r=>hl.appendChild(itemEl(r)));
 if(!fila.length)ul.innerHTML='<li class="empty">Nada na fila — tudo processado ✓</li>';if(!hist.length)hl.innerHTML='<li class="empty">Nenhum item processado ainda.</li>'}
</script></body></html>
