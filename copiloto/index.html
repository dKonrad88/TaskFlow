<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copiloto">
<title>Copiloto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="../hub-assets/hub-tema-base.css">
<link rel="stylesheet" href="temas.css">
<link rel="stylesheet" href="app.css">
<script>
(function () {
  var t = 'escuro';
  try {
    var s = localStorage.getItem('copiloto_tema');
    if (s === 'claro' || s === 'escuro' || s === 'cafe') t = s;
  } catch (e) {}
  var bs = { claro: 'light', escuro: 'dark', cafe: 'cafe' };
  document.documentElement.setAttribute('data-tema', t);
  document.documentElement.setAttribute('data-bs-theme', bs[t]);
})();
</script>
<script src="../hub-assets/hub-tema.js"></script>
<script>
(function () {
  if (window.hubAparencia) window.hubAparencia.apply = function () {};
  var t = document.documentElement.getAttribute('data-tema') || 'escuro';
  var bs = { claro: 'light', escuro: 'dark', cafe: 'cafe' };
  document.documentElement.setAttribute('data-bs-theme', bs[t]);
})();
</script>
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
